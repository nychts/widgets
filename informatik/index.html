<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informatik – Interaktive Widgets</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <h1>Informatik – Interaktive Widgets</h1>
  <p class="lead">Wähle Klasse und Reihe.</p>

  <nav class="toc" id="toc" aria-label="Inhaltsverzeichnis">
    <span class="toc-label">Inhalt</span>
  </nav>

  <div id="liste"></div>

  <footer>Interaktives Begleitmaterial · <a href="../index.html">alle Fächer</a></footer>
</div>

<script>
// Datenmodell: Klasse -> Reihen -> Widgets (identische Struktur wie mathematik/index.html).
const KLASSEN = [
  {
    klasse: "Einführungsphase",
    reihen: [
      {
        id: "ef-oop-java",
        reihe: "Objektorientierte Modellierung und Programmierung in Java",
        widgets: [
          { titel: "Konstruktor-Inspektor", stunde: "Stunde 11 · Der Konstruktor",
            beschr: "Konstruktor Schritt für Schritt ausführen, Objektzustandsdiagramm läuft mit. Ein Schalter wechselt zwischen richtigem und falschem Konstruktor – bei gleichem Ausführungsstand.",
            href: "konstruktor_inspektor.html" },
          { titel: "Sortier-Trainer: Algorithmus-Eigenschaften", stunde: "Stunde 3 · Algorithmusbegriff",
            beschr: "Neun Handlungsvorschriften, jede verletzt genau eine Eigenschaft: Eindeutigkeit, Determiniertheit, Finitheit oder Terminierung. Der Unterschied zwischen „endlich aufgeschrieben“ und „hält an“ wird dabei an Beispielen greifbar.",
            href: "sortieren.html#s03" },
          { titel: "Sortier-Trainer: Attribut oder Methode?", stunde: "Stunde 9 · Klassendiagramm",
            beschr: "Karten den Fächern des Klassendiagramms zuordnen – mit der dritten Kategorie „gehört nicht hinein“ für alles, was sich berechnen lässt (alter, vollstaendigeAdresse). Begründung erscheint sofort, falsche Karten lassen sich gezielt wiederholen.",
            href: "sortieren.html#s09" },
          { titel: "Sortier-Trainer: Compilerfehler-Ursachen", stunde: "Stunde 10 · Erste Java-Klasse",
            beschr: "Acht Meldungen und Fehlerbilder aus Fehlerprobe.java den vier Ursachen zuordnen: unbekannte Variable, Gültigkeitsbereich, illegal forward reference, Zugriff aus statischem Kontext. Speist die Fehlerkartei des Kurses.",
            href: "sortieren.html#s10" },
          { titel: "Sortier-Trainer: Konstruktor, Auftrag oder Anfrage?", stunde: "Stunde 13 · get- und set-Methoden",
            beschr: "Neun Methodenköpfe allein an Rückgabetyp und Parameterliste einordnen. Zeigt, dass der Name (gib…, setze…) nur eine Konvention ist — entscheidend ist der Kopf.",
            href: "sortieren.html#s13" },
          { titel: "Ablauf-Visualisierer: Verzweigung", stunde: "Stunde 17 · Verzweigungen in Methoden",
            beschr: "Geburtsjahr schieben und istVolljaehrig() Schritt für Schritt ausführen. Der genommene Zweig leuchtet auf, der andere wird ausgegraut — inklusive des Randfalls genau 18 Jahre.",
            href: "ablauf.html#s17" },
          { titel: "Ablauf-Visualisierer: Zählschleife", stunde: "Stunde 19 · Schleifen",
            beschr: "Organe an- und abwählen, die Trace-Tabelle läuft je Durchlauf mit. Die Schleifengrenze lässt sich auf i <= ORGANNAMEN.length umstellen — der Off-by-one bricht dann sichtbar mit einer Ausnahme ab.",
            href: "ablauf.html#s19" },
          { titel: "Ablauf-Visualisierer: Feld und Index", stunde: "Stunde 22 · Das eindimensionale Feld",
            beschr: "Index schieben und die drei Fälle nebeneinander sehen: belegter Platz, leerer Platz (NullPointerException) und Index außerhalb des Feldes. Zeigt, dass new Typ[5] noch keine Objekte erzeugt.",
            href: "ablauf.html#s22" },
          { titel: "Ablauf-Visualisierer: Lineare Suche", stunde: "Stunde 23 · Lineare Suche",
            beschr: "Gesuchte Nummer wählen und den Suchlauf Schritt für Schritt verfolgen. Der Vergleichszähler macht bester, mittlerer und ungünstigster Fall unmittelbar vergleichbar.",
            href: "ablauf.html#s23" },
          { titel: "Sortier-Trainer: Fehlerarten", stunde: "Stunde 18 · Fehlerarten",
            beschr: "Fehlermeldungen und Fehlerbilder als Compiler-, Laufzeit- oder Logikfehler einordnen. Zeigt den Unterschied zwischen „übersetzt nicht“, „bricht ab“ und „läuft durch, Ergebnis falsch“.",
            href: "sortieren.html#s18" },
        ],
      },
    ],
  },
];

const toc = document.getElementById("toc");
const liste = document.getElementById("liste");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

if (KLASSEN.length === 0) {
  toc.insertAdjacentHTML("beforeend", '<span class="empty" style="padding:0">– noch leer –</span>');
  liste.innerHTML = '<p class="empty">Für Informatik sind noch keine Widgets hinterlegt. Bald verfügbar.</p>';
}

for (const k of KLASSEN) {
  const kd = document.createElement("details");
  kd.className = "klasse";
  kd.open = true;
  kd.innerHTML = `<summary>${esc(k.klasse)}</summary>`;

  for (const r of k.reihen) {
    const a = document.createElement("a");
    a.href = "#" + r.id;
    a.textContent = r.reihe;
    toc.appendChild(a);

    const rd = document.createElement("details");
    rd.className = "reihe";
    rd.id = r.id;
    const cards = r.widgets.map(w => `
      <a class="card" href="${esc(w.href)}">
        <span class="t">${esc(w.titel)}</span>
        <span class="s">${esc(w.stunde)}</span>
        <span class="d">${esc(w.beschr)}</span>
        <span class="go">Öffnen ›</span>
      </a>`).join("");
    rd.innerHTML = `<summary>${esc(r.reihe)}<span class="count">${r.widgets.length} Widgets</span></summary>
      <div class="cards">${cards}</div>`;
    kd.appendChild(rd);
  }
  liste.appendChild(kd);
}

function oeffne(id) {
  const el = document.getElementById(id);
  if (!el) return;
  let p = el;
  while (p) { if (p.tagName === "DETAILS") p.open = true; p = p.parentElement; }
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}
toc.addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  e.preventDefault();
  const id = a.getAttribute("href").slice(1);
  history.replaceState(null, "", "#" + id);
  oeffne(id);
});
if (location.hash) oeffne(location.hash.slice(1));
</script>
</body>
</html>
