<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zufalls-Labor – Gesetz der großen Zahlen (Stunde 3)</title>
<style>
  :root{
    --haupt:#14507d; --blau:#2c7bb6; --rot:#c0392b; --gruen:#2a7a3b;
    --orange:#c45e00; --grau:#e7edf3; --grau2:#f4f7fa; --text:#1c2a36;
  }
  *{box-sizing:border-box}
  body{margin:0}
  .wrap{font-family:system-ui,Segoe UI,Roboto,sans-serif;color:var(--text);
    max-width:760px;margin:0 auto;padding:18px;line-height:1.45}
  h1{font-size:1.35rem;margin:.1em 0;color:var(--haupt)}
  .sub{color:#5a6b78;margin:0 0 16px;font-size:.95rem}
  .karte{background:var(--grau2);border:1px solid var(--grau);border-radius:14px;
    padding:16px 18px;margin-bottom:16px}
  .knoepfe{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 15px;
    background:var(--haupt);color:#fff;cursor:pointer}
  button:hover{background:#0f3f63}
  button.sek{background:#fff;color:var(--haupt);border:1.5px solid var(--haupt)}
  button:active{transform:translateY(1px)}
  .zahlen{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 4px}
  .stat{flex:1 1 120px;background:#fff;border:1px solid var(--grau);border-radius:10px;
    padding:10px 12px;text-align:center}
  .stat .z{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;
    color:var(--haupt)}
  .stat .l{font-size:.8rem;color:#5a6b78}
  svg{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--grau);
    border-radius:10px;margin-top:6px}
  .muenzen{font-size:1.5rem;letter-spacing:2px;min-height:1.6em;margin:4px 0;
    word-break:break-all}
  .callout{background:#fff;border-left:5px solid var(--orange);border-radius:8px;
    padding:12px 14px;margin-top:10px;font-size:.95rem}
  .callout.gruen{border-color:var(--gruen)}
  .streak{font-weight:800}
  label.p{display:block;font-weight:600;margin:8px 0 2px;font-size:.9rem}
  select{font:inherit;padding:6px 8px;border-radius:8px;border:1.5px solid var(--grau)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Zufalls-Labor: Wirf die Münze – oft!</h1>
  <p class="sub">Bei <b>wenigen</b> Würfen schwankt die Trefferquote wild. Bei
    <b>vielen</b> Würfen nähert sie sich der Wahrscheinlichkeit. Probier es aus.</p>

  <div class="karte">
    <label class="p" for="pfair">Münze:</label>
    <select id="pfair">
      <option value="0.5">faire Münze – P(Kopf) = 50 %</option>
      <option value="0.7">gezinkt – P(Kopf) = 70 %</option>
      <option value="0.3">gezinkt – P(Kopf) = 30 %</option>
    </select>

    <div class="knoepfe" style="margin-top:12px">
      <button id="b1">1× werfen</button>
      <button id="b10" class="sek">10×</button>
      <button id="b100" class="sek">100×</button>
      <button id="b1000" class="sek">1000×</button>
      <button id="reset" class="sek">Zurücksetzen</button>
    </div>
    <div class="muenzen" id="muenzen" aria-live="polite"></div>

    <div class="zahlen">
      <div class="stat"><div class="z" id="nWurf">0</div><div class="l">Würfe</div></div>
      <div class="stat"><div class="z" id="nKopf">0</div><div class="l">Kopf</div></div>
      <div class="stat"><div class="z" id="relf">–</div>
        <div class="l">rel. Häufigkeit Kopf</div></div>
    </div>

    <svg id="verlauf" viewBox="0 0 340 160" role="img"
         aria-label="Verlauf der relativen Häufigkeit"></svg>
    <p class="callout gruen" id="konv"></p>
    <p class="callout" id="streakBox"></p>
  </div>
</div>

<script>
(function(){
  const el=id=>document.getElementById(id);
  let n=0,kopf=0,hist=[],streakTyp=null,streakLen=0,maxStreak=0;
  const nf=new Intl.NumberFormat("de-DE");
  const pf=()=>+el("pfair").value;

  function wirf(m){
    let letzte="";
    for(let i=0;i<m;i++){
      const k=Math.random()<pf();
      n++; if(k)kopf++;
      // Serie zählen
      const typ=k?"K":"Z";
      if(typ===streakTyp){streakLen++;}else{streakTyp=typ;streakLen=1;}
      if(streakLen>maxStreak)maxStreak=streakLen;
      hist.push(kopf/n);
      if(i>=m-40) letzte+=k?"🟦":"⬜";
    }
    el("muenzen").textContent = m<=40? letzte : "…"+letzte+"  (letzte 40)";
    render();
  }

  function render(){
    el("nWurf").textContent=nf.format(n);
    el("nKopf").textContent=nf.format(kopf);
    const rel=n? kopf/n : null;
    el("relf").textContent = rel==null? "–" : (rel*100).toLocaleString("de-DE",
      {minimumFractionDigits:1,maximumFractionDigits:1})+" %";
    zeichne();
    // Konvergenz-Text
    if(n>0){
      const abw=Math.abs(rel-pf())*100;
      el("konv").innerHTML = n<20
        ? `Erst <b>${n}</b> Würfe – die Quote springt noch stark. Wirf mehr!`
        : `Nach <b>${nf.format(n)}</b> Würfen liegt die Quote nur noch
           <b>${abw.toLocaleString("de-DE",{maximumFractionDigits:1})} Prozentpunkte</b>
           neben den erwarteten ${(pf()*100)} %. <b>Gesetz der großen Zahlen.</b>`;
    } else el("konv").textContent="Noch kein Wurf.";
    // Spielerfehlschluss
    if(streakLen>=3){
      const was=streakTyp==="K"?"Kopf":"Zahl";
      const gegen=streakTyp==="K"?"Zahl":"Kopf";
      el("streakBox").style.display="block";
      el("streakBox").innerHTML=
        `Gerade <span class="streak">${streakLen}× ${was}</span> in Folge
         (längste Serie: ${maxStreak}). <b>Trotzdem</b> ist ${gegen} beim nächsten
         Wurf <u>nicht</u> wahrscheinlicher – p bleibt ${(pf()*100)} %. Die Münze
         hat kein Gedächtnis. <em>Das ist der Spielerfehlschluss.</em>`;
    } else el("streakBox").style.display="none";
  }

  const svg=el("verlauf"), ns="http://www.w3.org/2000/svg";
  const W=340,H=160,L=34,R=8,T=10,B=20, px=W-L-R, py=H-T-B;
  function zeichne(){
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    const p=pf();
    // Rahmen + Zielhöhe
    add("line",{x1:L,y1:T,x2:L,y2:T+py,stroke:"#889"});
    add("line",{x1:L,y1:T+py,x2:L+px,y2:T+py,stroke:"#889"});
    // y 0..1, Marken 0/0.5/1
    [0,0.5,1].forEach(v=>{
      const yy=T+py-v*py;
      add("line",{x1:L-3,y1:yy,x2:L,y2:yy,stroke:"#889"});
      add("text",{x:L-6,y:yy+3,"text-anchor":"end","font-size":9,fill:"#556"})
        .textContent=(v*100)+"%";
    });
    // Ziel-Linie p
    const yp=T+py-p*py;
    add("line",{x1:L,y1:yp,x2:L+px,y2:yp,stroke:"var(--orange)",
      "stroke-dasharray":"4 3","stroke-width":1.4});
    add("text",{x:L+px,y:yp-3,"text-anchor":"end","font-size":9,
      fill:"var(--orange)","font-weight":700}).textContent="Erwartung "+(p*100)+"%";
    // Kurve (auf max ~300 Punkte ausdünnen)
    if(hist.length){
      const step=Math.max(1,Math.floor(hist.length/300));
      let d="";
      for(let i=0;i<hist.length;i+=step){
        const x=L+ (hist.length>1? i/(hist.length-1):0)*px;
        const y=T+py-hist[i]*py;
        d+=(d?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";
      }
      add("path",{d:d,fill:"none",stroke:"var(--haupt)","stroke-width":1.8});
    }
  }
  function add(t,a){const e=document.createElementNS(ns,t);
    for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}

  function reset(){n=0;kopf=0;hist=[];streakTyp=null;streakLen=0;maxStreak=0;
    el("muenzen").textContent="";render();}

  el("b1").onclick=()=>wirf(1);
  el("b10").onclick=()=>wirf(10);
  el("b100").onclick=()=>wirf(100);
  el("b1000").onclick=()=>wirf(1000);
  el("reset").onclick=reset;
  el("pfair").onchange=reset;
  reset();
})();
</script>
</body>
</html>
